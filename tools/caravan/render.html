<!doctype html><meta charset="utf-8" />
<body style="margin: 0; background: #0000">
  <canvas id="c"></canvas>
  <script type="module">
    /*
     * Mansa Musa's caravan as pixel-art sprites (tools/prepare-caravan-sprites.ts).
     * The caravan's own articulated rig (packages/shared/royal-caravan.ts) is
     * drawn here exactly as the native world drew it: fixed joint meshes,
     * per-tick joint matrices, the same banded light and finishes. Each actor
     * is rendered alone in the world's 2:1 isometric view at the sprite
     * density, without anti-aliasing, so its pixels stay crisp.
     */
    import * as T from '../three/three.module.min.js';

    const renderer = new T.WebGLRenderer({
      canvas: c,
      antialias: false,
      alpha: true,
      preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(1);
    renderer.setClearColor(0, 0);
    const scene = new T.Scene();
    // The native shader (web/src/engine/RiggedCaravan.ts), in view space.
    const material = new T.ShaderMaterial({
      vertexShader: `
        attribute vec3 color; attribute vec3 finish;
        varying vec4 vColor; varying vec3 vLocal; varying vec3 vNormal; varying vec3 vFinish;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vLocal = wp.xyz;
          vec3 n = normalize(normalMatrix * normal);
          float lambert = max(0., dot(n, normalize(vec3(-.35, .65, .72))));
          float light = .55 + .45 * floor(lambert * 9.) / 9.;
          vColor = vec4(color * mix(light, 1., finish.z), 1.);
          vNormal = n; vFinish = finish;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        varying vec4 vColor; varying vec3 vLocal; varying vec3 vNormal; varying vec3 vFinish;
        void main() {
          float grain = fract(sin(dot(floor(vLocal * 1.3), vec3(12.9898, 78.233, 37.719))) * 43758.5453);
          vec3 color = vColor.rgb * (.97 + .055 * grain);
          if (vFinish.z > .5) {
            vec3 n = normalize(vNormal), l = normalize(vec3(-.35, .65, .72)), h = normalize(l + vec3(0., 0., 1.));
            float diffuse = .54 + .46 * floor(max(0., dot(n, l)) * 24.) / 24.;
            float spec = pow(max(0., dot(n, h)), mix(12., 90., 1. - vFinish.x));
            color = vColor.rgb * diffuse + mix(vec3(.1), vec3(.92, .74, .38), vFinish.y) * spec * (.1 + .65 * vFinish.y);
          }
          gl_FragColor = vec4(color, 1.);
        }`,
      side: T.DoubleSide,
    });

    /* ── Geometry: one mesh per joint, as uploaded by the bake tool ── */
    const meta = await (await fetch('../data/joints.json')).json();
    const buffer = new Float32Array(
      await (await fetch('../data/joints.bin')).arrayBuffer(),
    );
    const meshes = meta.joints.map((j) => {
      const geo = new T.BufferGeometry(),
        at = (o, n) => buffer.subarray(o, o + n);
      geo.setAttribute(
        'position',
        new T.BufferAttribute(at(j.position, j.count * 3), 3),
      );
      geo.setAttribute(
        'normal',
        new T.BufferAttribute(at(j.normal, j.count * 3), 3),
      );
      geo.setAttribute(
        'color',
        new T.BufferAttribute(at(j.color, j.count * 3), 3),
      );
      geo.setAttribute(
        'finish',
        new T.BufferAttribute(at(j.finish, j.count * 3), 3),
      );
      const mesh = new T.Mesh(geo, material);
      mesh.matrixAutoUpdate = false;
      mesh.frustumCulled = false;
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    });

    /* ── The world's isometric camera: +X screen down-right, +Z down-left ── */
    const cam = new T.OrthographicCamera(-1, 1, 1, -1, -5000, 5000);
    cam.position
      .set(1, Math.SQRT2 * Math.tan(Math.PI / 6), 1)
      .multiplyScalar(1000);
    cam.lookAt(0, 0, 0);
    cam.updateMatrixWorld(true);
    const v = new T.Vector3(),
      K = meta.density; // sprite px per model unit (1 unit = 1 world px)

    /** Sets every joint's matrix for one tick (16 floats each, column-major). */
    window.pose = (base64) => {
      const bytes = Uint8Array.from(atob(base64), (ch) => ch.charCodeAt(0));
      const m = new Float32Array(bytes.buffer);
      meshes.forEach((mesh, i) => {
        mesh.matrix.fromArray(m, i * 16);
        mesh.matrixWorld.copy(mesh.matrix);
      });
    };
    /**
     * Renders the given joints alone into a W×H frame whose foot point
     * (fx, fy) sits on `root` (model units). Returns a PNG data URL.
     */
    window.shoot = ({ joints, root, W, H, fx, fy }) => {
      for (const m of meshes) m.visible = false;
      for (const i of joints) meshes[i].visible = true;
      v.set(...root).applyMatrix4(cam.matrixWorldInverse);
      Object.assign(cam, {
        left: v.x - fx / K,
        right: v.x + (W - fx) / K,
        top: v.y + fy / K,
        bottom: v.y - (H - fy) / K,
      });
      cam.updateProjectionMatrix();
      renderer.setSize(W, H, false);
      renderer.render(scene, cam);
      return c.toDataURL('image/png');
    };
    window.READY = true;
  </script>
</body>

<!doctype html>
<html>
  <meta charset="utf-8" />
  <body style="margin: 0; background: #0000">
    <canvas id="c"></canvas>
    <script type="importmap">
      { "imports": { "three": "../three/three.module.min.js" } }
    </script>
    <script type="module">
      /* Complete exterior from the owner's Site view. Keep the chamber roof,
       * enclosing courtyard and every neighboring house together so their
       * internal occlusion survives placement in the curved pixel world. */
      import * as T from '../three/three.module.min.js';
      import { GLTFLoader } from '../three/GLTFLoader.js';
      const P = new URLSearchParams(location.search);
      const s = +P.get('s'),
        kv = +P.get('kv'),
        D = +P.get('D');
      const PX = 22.627 * s * D;
      const renderer = new T.WebGLRenderer({
        canvas: c,
        antialias: false,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.setClearColor(0, 0);
      renderer.localClippingEnabled = true;
      const scene = new T.Scene();
      const gltf = await new GLTFLoader().loadAsync(
        '../room/assets/al-bayt-al-muzlim-complete.glb',
      );
      const root = gltf.scene;
      const SKIP = ['Courtyard Shadows', 'Site Context Shadows'];
      // Bound the source's expansive sand plane to this landmark's plot.
      // Architecture, streets and vegetation retain their original geometry.
      root.getObjectByName('Site_Ground')?.traverse((o) => {
        if (!o.isMesh) return;
        const positions = o.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
          positions.setX(i, T.MathUtils.clamp(positions.getX(i), -44, 16));
          positions.setZ(i, T.MathUtils.clamp(positions.getZ(i), -28, 23));
        }
        positions.needsUpdate = true;
        o.geometry.computeBoundingBox();
        o.geometry.computeBoundingSphere();
      });
      root.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = o.receiveShadow = true;
          for (const m of [o.material].flat())
            if (
              m.name?.startsWith('projection') ||
              m.name?.startsWith('ray') ||
              m.name?.startsWith('flame')
            )
              o.castShadow = false;
        }
      });
      // three.js turns the GLB's spaces into underscores; match the originals.
      const plain = (o) => o.name.replace(/_/g, ' ');
      for (const name of SKIP)
        root.getObjectByName(name.replace(/ /g, '_'))?.removeFromParent();
      const room = new T.Group();
      room.add(root);
      // Match the Site reference orientation and preserve building proportions.
      room.rotation.y = Math.PI / 2;
      room.scale.set(1, kv, 1);
      scene.add(room);
      scene.add(new T.HemisphereLight('#fff1dc', '#8b8a7c', 1.35));
      const sun = new T.DirectionalLight('#ffe5bd', 1.9);
      sun.position.set(-6, 14, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, {
        left: -34,
        right: 34,
        top: 34,
        bottom: -34,
        near: 0.5,
        far: 120,
      });
      sun.shadow.bias = -0.0004;
      scene.add(sun);
      room.updateMatrixWorld(true);

      const cam = new T.OrthographicCamera(-1, 1, 1, -1, -200, 200);
      cam.position.set(30, 30 * Math.SQRT2 * Math.tan(Math.PI / 6), 30);
      cam.lookAt(0, 0, 0);
      cam.updateMatrixWorld(true);
      const box = new T.Box3().setFromObject(room);
      let x0 = 1e9,
        x1 = -1e9,
        y0 = 1e9,
        y1 = -1e9;
      const v = new T.Vector3();
      for (const X of [box.min.x, box.max.x])
        for (const Y of [box.min.y, box.max.y])
          for (const Z of [box.min.z, box.max.z]) {
            v.set(X, Y, Z).applyMatrix4(cam.matrixWorldInverse);
            x0 = Math.min(x0, v.x);
            x1 = Math.max(x1, v.x);
            y0 = Math.min(y0, v.y);
            y1 = Math.max(y1, v.y);
          }
      const W = Math.ceil((x1 - x0) * PX) + 8,
        H = Math.ceil((y1 - y0) * PX) + 8;
      Object.assign(cam, {
        left: x0 - 4 / PX,
        right: x0 - 4 / PX + W / PX,
        top: y1 + 4 / PX,
        bottom: y1 + 4 / PX - H / PX,
      });
      cam.updateProjectionMatrix();
      renderer.setSize(W, H, false);
      /** Canvas pixel of a room point (room units, before turning and stretching). */
      const toPx = (X, Y, Z) => {
        v.set(X, Y, Z).applyMatrix4(room.matrixWorld).project(cam);
        return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
      };

      // Render the full architecture in one pass, then split only its image.
      // Interior objects remain behind the opaque chamber walls and roof.
      function pieceOf(node) {
        return plain(node) === 'Site Ground' ? 'floor' : 'site';
      }
      const parts = new Map();
      const hidden = new T.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: false,
      });
      /** Each piece's footprint in room units: [x0, z0, x1, z1]. */
      const boxes = {};
      const meshes = [];
      root.traverse((o) => o.isMesh && meshes.push(o));
      // The named part a mesh belongs to: its nearest ancestor with a known name
      // (the GLB wraps them all in one scene node).
      const NAMED = new Set(gltf.parser.json.nodes.map((node) => node.name));
      const nodeOf = (o) => {
        let p = o;
        while (p && !NAMED.has(plain(p))) p = p.parent;
        return p ?? o;
      };
      for (const mesh of meshes) {
        const node = nodeOf(mesh),
          g = mesh.geometry,
          pos = g.attributes.position,
          idx = g.index;
        const toRoom = new T.Matrix4()
          .copy(root.matrixWorld)
          .invert()
          .multiply(mesh.matrixWorld);
        const tri = idx ? idx.count / 3 : pos.count / 3;
        const buckets = new Map(),
          a = new T.Vector3(),
          b = new T.Vector3(),
          cc = new T.Vector3();
        for (let t = 0; t < tri; t++) {
          const ia = idx ? idx.getX(t * 3) : t * 3,
            ib = idx ? idx.getX(t * 3 + 1) : t * 3 + 1,
            ic = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
          a.fromBufferAttribute(pos, ia).applyMatrix4(toRoom);
          b.fromBufferAttribute(pos, ib).applyMatrix4(toRoom);
          cc.fromBufferAttribute(pos, ic).applyMatrix4(toRoom);
          const k = pieceOf(
            node,
            (a.x + b.x + cc.x) / 3,
            (a.y + b.y + cc.y) / 3,
            (a.z + b.z + cc.z) / 3,
          );
          if (!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(ia, ib, ic);
          const bx = (boxes[k] ??= [1e9, 1e9, -1e9, -1e9]);
          for (const p of [a, b, cc]) {
            bx[0] = Math.min(bx[0], p.x);
            bx[1] = Math.min(bx[1], p.z);
            bx[2] = Math.max(bx[2], p.x);
            bx[3] = Math.max(bx[3], p.z);
          }
        }
        for (const [k, list] of buckets) {
          const sub = new T.Mesh(g.clone(), mesh.material);
          sub.geometry.setIndex(list);
          sub.castShadow = mesh.castShadow;
          sub.receiveShadow = true;
          sub.userData.material = mesh.material;
          mesh.parent.add(sub);
          sub.position.copy(mesh.position);
          sub.quaternion.copy(mesh.quaternion);
          sub.scale.copy(mesh.scale);
          if (!parts.has(k)) parts.set(k, []);
          parts.get(k).push(sub);
        }
        mesh.removeFromParent();
      }
      function render(only) {
        for (const [k, list] of parts)
          for (const m of list)
            m.material = !only || k === only ? m.userData.material : hidden;
        renderer.render(scene, cam);
        return c.toDataURL('image/png');
      }
      window.RESULT = {
        W,
        H,
        PX,
        pieces: [...parts.keys()],
        boxes,
        render,
        toPx,
      };
      window.READY = true;
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mansa Musa — the gold caravan</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eee5d6;
        color: #233d32;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        height: 76px;
        padding: 15px 24px;
        background: #faf8ef;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #d8d0bd;
      }
      h1 {
        font:
          26px Georgia,
          serif;
        margin: 0 0 4px;
      }
      header p {
        margin: 0;
        font-size: 12px;
        color: #637568;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 1.4px;
        color: #816333;
      }
      main {
        height: calc(100dvh - 76px);
        position: relative;
      }
      #view {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .panel {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 248px;
        padding: 18px;
        background: #faf8eff0;
        border: 1px solid #d8d0bd;
        border-radius: 9px;
        box-shadow: 0 5px 24px #37453012;
      }
      label {
        display: block;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      select,
      button,
      a.download {
        font: inherit;
        border: 1px solid #c8cbb9;
        background: #fffdf5;
        color: #233d32;
        border-radius: 5px;
        padding: 9px 11px;
      }
      select {
        width: 100%;
      }
      .angles {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 15px 0;
      }
      .angles button {
        font-size: 12px;
        flex: 1;
      }
      .hint {
        font-size: 12px;
        line-height: 1.6;
        color: #637568;
      }
      .download {
        display: block;
        text-decoration: none;
        text-align: center;
        margin-top: 12px;
      }
      .timeline {
        position: absolute;
        bottom: 23px;
        left: 50%;
        transform: translateX(-50%);
        width: min(700px, calc(100% - 40px));
        padding: 13px 17px;
        background: #faf8eff2;
        border: 1px solid #d8d0bd;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .timeline input {
        flex: 1;
        min-width: 70px;
        accent-color: #4c7155;
      }
      .timeline output {
        width: 39px;
        font-size: 12px;
      }
      .status {
        position: absolute;
        right: 20px;
        top: 20px;
        background: #faf8efdd;
        padding: 9px 14px;
        border-radius: 20px;
        font-size: 12px;
      }
      #error {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        background: #faf8ef;
        padding: 20px;
        border-radius: 8px;
        max-width: 80%;
      }
      [hidden] {
        display: none !important;
      }
      button,
      a,
      select {
        outline-offset: 4px;
        cursor: pointer;
      }
      @media (max-width: 700px) {
        header {
          height: 88px;
          padding: 12px 16px;
        }
        h1 {
          font-size: 22px;
        }
        .badge {
          max-width: 110px;
          text-align: right;
          line-height: 1.6;
        }
        main {
          height: calc(100dvh - 88px);
        }
        .panel {
          width: 210px;
          top: 12px;
          left: 12px;
          padding: 12px;
        }
        .hint {
          display: none;
        }
        .angles {
          margin: 10px 0;
        }
        .status {
          top: auto;
          bottom: 95px;
          right: 14px;
        }
        .timeline {
          bottom: 15px;
          padding: 10px;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Mansa Musa</h1>
        <p>The gold caravan · Mali Empire</p>
      </div>
      <span class="badge">DRAFT · ILLUSTRATIVE RECONSTRUCTION</span>
    </header>
    <main>
      <div id="view" aria-label="Rotatable animated 3D model"></div>
      <aside class="panel">
        <label for="model">Explore the collection</label
        ><select id="model">
          <option value="mansa-musa-standing">Mansa Musa · standing</option>
          <option value="mali-gold-caravan">The complete caravan</option>
          <option value="mansa-musa-mounted">Mansa Musa · mounted</option>
          <option value="mali-guard">Malian guard</option>
        </select>
        <div class="angles">
          <button data-angle="front">Front</button
          ><button data-angle="rear">Rear</button
          ><button data-angle="side">Side</button
          ><button data-angle="overhead">Overhead</button
          ><button data-angle="isometric">Isometric</button>
          <button id="hero">Gold handover</button
          ><button id="overview">Overview</button
          ><button id="portrait">Face close-up</button>
        </div>
        <p class="hint">
          Drag to orbit. Scroll or pinch to zoom.<br />Pause to inspect the
          figures and each gold handover from any angle.
        </p>
        <a id="download" class="download" download href="mali-gold-caravan.glb"
          >Download this 3D model</a
        >
      </aside>
      <div id="status" class="status" role="status">Loading the caravan…</div>
      <div id="error" hidden role="alert"></div>
      <div class="timeline">
        <button id="play" aria-label="Pause animation">Pause</button
        ><label for="time" style="position: absolute; clip: rect(0, 0, 0, 0)"
          >Scene time</label
        ><input
          id="time"
          type="range"
          min="0"
          max="20"
          value="0"
          step="0.01"
        /><output id="seconds">0.0s</output
        ><select id="speed" aria-label="Playback speed" style="width: 76px">
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1½×</option>
        </select>
      </div>
    </main>
    <script type="module">
      import * as T from './vendor/three.module.min.js';
      import { GLTFLoader } from './vendor/GLTFLoader.js';
      import { OrbitControls } from './vendor/OrbitControls.js';
      const host = document.getElementById('view'),
        renderer = new T.WebGLRenderer({
          antialias: false,
          alpha: true,
          preserveDrawingBuffer: true,
        });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      host.append(renderer.domElement);
      const scene = new T.Scene();
      scene.background = new T.Color('#eee5d6');
      scene.add(new T.HemisphereLight('#fff5e8', '#646e7b', 1.0));
      const sun = new T.DirectionalLight('#ffe8ca', 2.4);
      sun.position.set(-12, 22, 17);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -18,
        right: 18,
        top: 18,
        bottom: -18,
        near: 0.5,
        far: 70,
      });
      sun.shadow.bias = -0.0003;
      scene.add(sun);
      const fill = new T.DirectionalLight('#bdd8e4', 1.0);
      fill.position.set(12, 7, -8);
      scene.add(fill);
      const rim = new T.DirectionalLight('#fff4de', 1.6);
      rim.position.set(-4, 8, -12);
      scene.add(rim);
      // Local softbox environment: reflective gold without any remote HDRI.
      const studio = new T.Scene();
      studio.background = new T.Color('#777b80');
      for (const [x, y, z, w, h, power] of [
        [-5, 5, 5, 4, 7, 4],
        [5, 3, -3, 3, 6, 2],
        [0, 8, 0, 6, 2, 3],
      ]) {
        const card = new T.Mesh(
          new T.PlaneGeometry(w, h),
          new T.MeshBasicMaterial({
            color: new T.Color().setRGB(power, power * 0.95, power * 0.88),
            side: T.DoubleSide,
          }),
        );
        card.position.set(x, y, z);
        card.lookAt(0, 1, 0);
        studio.add(card);
      }
      const pmrem = new T.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio, 0.04).texture;
      scene.environmentIntensity = 0.75;
      pmrem.dispose();
      studio.traverse((o) => {
        if (o.isMesh) {
          o.geometry.dispose();
          o.material.dispose();
        }
      });
      const floor = new T.Mesh(
        new T.PlaneGeometry(100, 100),
        new T.MeshStandardMaterial({ color: '#d1b17e', roughness: 1 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.012;
      floor.receiveShadow = true;
      scene.add(floor);
      const camera = new T.PerspectiveCamera(38, 1, 0.025, 250),
        controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.minDistance = 0.45;
      controls.maxDistance = 85;
      let model,
        mixer,
        time = 0,
        playing = true,
        request = 0,
        span = 20,
        center = new T.Vector3(0, 1, 0),
        radius = 25,
        follow = false,
        lastHero = new T.Vector3();
      const slider = document.getElementById('time'),
        seconds = document.getElementById('seconds'),
        status = document.getElementById('status'),
        select = document.getElementById('model'),
        play = document.getElementById('play');
      function angle(name) {
        const dirs = {
            front: [0, 0.25, 1],
            rear: [0, 0.25, -1],
            side: [1, 0.25, 0],
            overhead: [0.04, 1, 0.06],
            isometric: [1, 0.68, 1],
          },
          d = new T.Vector3(...dirs[name]).normalize();
        camera.position.copy(center).addScaledVector(d, radius);
        controls.target.copy(center);
        controls.update();
        renderer.render(scene, camera);
      }
      function setTime(t) {
        time = ((t % span) + span) % span;
        mixer?.setTime(time);
        if (follow && model) {
          model.updateMatrixWorld(true);
          const ruler = model.getObjectByName('mansa-musa');
          if (ruler) {
            const p = ruler.getWorldPosition(new T.Vector3()),
              d = p.clone().sub(lastHero);
            camera.position.add(d);
            controls.target.add(d);
            center.add(d);
            lastHero.copy(p);
          }
        }
        slider.value = String(time);
        seconds.value = time.toFixed(1) + 's';
        const station =
          time < 2 ||
          (time >= 5.33 && time < 7.33) ||
          (time >= 10.67 && time < 12.67);
        status.textContent = station
          ? 'Sharing gold with the community'
          : 'The caravan continues its journey';
        renderer.render(scene, camera);
      }
      function hero() {
        if (!model) return;
        const ruler = model.getObjectByName('mansa-musa');
        if (!ruler) return;
        model.updateMatrixWorld(true);
        lastHero.copy(ruler.getWorldPosition(new T.Vector3()));
        center.copy(lastHero).add(new T.Vector3(0, 1.2, 0.42));
        radius = 5.6;
        camera.position.copy(center).add(new T.Vector3(3.5, 2.0, 4.0));
        controls.target.copy(center);
        controls.update();
        follow = true;
      }
      function overview() {
        if (!model) return;
        follow = false;
        const wrapper = model.getObjectByName('mansa-musa-gold-caravan'),
          focus =
            wrapper?.children.find((o) => o.name === 'mali-gold-caravan') ||
            model,
          box = new T.Box3().setFromObject(focus),
          size = box.getSize(new T.Vector3());
        center = box.getCenter(new T.Vector3());
        radius =
          (Math.max(...size.toArray()) /
            (2 * Math.tan((camera.fov * Math.PI) / 360))) *
          1.13;
        angle('isometric');
      }
      function portrait() {
        if (!model) return;
        const head = model.getObjectByName('head');
        if (!head) return;
        follow = false;
        model.updateMatrixWorld(true);
        center
          .copy(head.getWorldPosition(new T.Vector3()))
          .add(new T.Vector3(0, -0.035, 0.01));
        radius = 0.98;
        const direction = new T.Vector3(0, 0.06, 1);
        head.getWorldQuaternion(new T.Quaternion()).normalize();
        direction.applyQuaternion(head.getWorldQuaternion(new T.Quaternion()));
        camera.position.copy(center).addScaledVector(direction, 0.98);
        controls.target.copy(center);
        controls.update();
        renderer.render(scene, camera);
      }
      async function loadModel(name) {
        const id = ++request;
        status.textContent = 'Loading the model…';
        const gltf = await new GLTFLoader().loadAsync('./' + name + '.glb');
        if (id !== request) return;
        if (model) {
          scene.remove(model);
          mixer?.stopAllAction();
          mixer?.uncacheRoot(model);
          const geometry = new Set(),
            materials = new Set(),
            textures = new Set();
          model.traverse((o) => {
            if (o.isMesh) {
              geometry.add(o.geometry);
              for (const material of Array.isArray(o.material)
                ? o.material
                : [o.material])
                materials.add(material);
            }
          });
          for (const material of materials) {
            for (const value of Object.values(material))
              if (value?.isTexture) textures.add(value);
            material.dispose();
          }
          for (const texture of textures) texture.dispose();
          for (const g of geometry) g.dispose();
        }
        model = gltf.scene;
        const full = name === 'mali-gold-caravan';
        scene.background = new T.Color(full ? '#e5dccb' : '#20262d');
        scene.fog = full ? null : new T.Fog('#20262d', 5, 22);
        floor.material.color.set(full ? '#d1b17e' : '#272e36');
        const shadowExtent = full ? 18 : 3;
        Object.assign(sun.shadow.camera, {
          left: -shadowExtent,
          right: shadowExtent,
          top: shadowExtent,
          bottom: -shadowExtent,
        });
        sun.shadow.camera.updateProjectionMatrix();
        model.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        scene.add(model);
        mixer = new T.AnimationMixer(model);
        for (const clip of gltf.animations) mixer.clipAction(clip).play();
        span = gltf.animations[0]?.duration || 20;
        slider.max = span;
        const box = new T.Box3().setFromObject(model),
          size = box.getSize(new T.Vector3());
        center = box.getCenter(new T.Vector3());
        radius =
          (Math.max(...size.toArray()) /
            (2 * Math.tan((camera.fov * Math.PI) / 360))) *
          1.22;
        controls.minDistance = name === 'mali-gold-caravan' ? 0.8 : 0.45;
        follow = false;
        angle('isometric');
        document.getElementById('download').href = name + '.glb';
        setTime(0);
        if (name === 'mali-gold-caravan') hero();
        window.__maliViewer = {
          scene,
          camera,
          renderer,
          controls,
          floor,
          get model() {
            return model;
          },
          get mixer() {
            return mixer;
          },
          setTime,
          loadModel,
          angle,
          hero,
          overview,
          portrait,
          get time() {
            return time;
          },
          pause() {
            playing = false;
            play.textContent = 'Play';
            play.setAttribute('aria-label', 'Resume animation');
          },
        };
      }
      function fail(e) {
        const el = document.getElementById('error');
        el.hidden = false;
        el.textContent = 'The 3D model could not load. ' + e.message;
        console.error(e);
      }
      select.onchange = () => loadModel(select.value).catch(fail);
      document.getElementById('hero').onclick = hero;
      document.getElementById('portrait').onclick = portrait;
      document.getElementById('overview').onclick = overview;
      document
        .querySelectorAll('[data-angle]')
        .forEach((b) => (b.onclick = () => angle(b.dataset.angle)));
      play.onclick = () => {
        playing = !playing;
        play.textContent = playing ? 'Pause' : 'Play';
        play.setAttribute(
          'aria-label',
          playing ? 'Pause animation' : 'Resume animation',
        );
      };
      slider.oninput = () => setTime(+slider.value);
      function resize() {
        renderer.setSize(host.clientWidth, host.clientHeight);
        camera.aspect = host.clientWidth / host.clientHeight;
        camera.updateProjectionMatrix();
      }
      new ResizeObserver(resize).observe(host);
      resize();
      let last = performance.now();
      renderer.setAnimationLoop((now) => {
        const dt = Math.min(0.06, (now - last) / 1000);
        last = now;
        if (playing && mixer)
          setTime(time + dt * +document.getElementById('speed').value);
        controls.update();
        renderer.render(scene, camera);
      });
      loadModel('mali-gold-caravan').catch(fail);
    </script>
  </body>
</html>
